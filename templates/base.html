<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Unamused — Is Muse unamused by your business?{% endblock %}</title>
<meta name="description" content="Free audit: is Muse unamused by your business website? Score how well AI agents can read, recommend, and book you.">
<link rel="canonical" href="https://unamused.app/">
<meta property="og:title" content="Unamused — Is Muse unamused by your business?">
<meta property="og:description" content="Free audit: score how well AI agents can read, recommend, and transact with your business website.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://unamused.app/">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Organization",
 "name":"Unamused","url":"https://unamused.app/",
 "description":"Free audit of how ready a business website is for AI agents.",
 "sameAs":["https://github.com/DPL1979/unamused"]}
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav"><div class="wrap nav-in">
<a class="brand" href="/">Unamused</a>
<span class="tagline">Don't be unamused.</span>
</div></header>
<main>{% block content %}{% endblock %}</main>
<footer><div class="wrap foot-in">
<span><b>Unamused</b> · an independent project, not affiliated with Meta.</span>
<span class="foot-links"><a href="/badge">Badge</a> · <a href="/connector">Connector</a> · <a href="/api">API</a></span>
<span>We score what lets an agent complete a task — no snake oil.</span>
</div></footer>
<script>
document.addEventListener('submit', function(e){
  if (e.target.id === 'audit-form') {
    var b = e.target.querySelector('button');
    b.disabled = true;
    b.textContent = 'Auditing… about 10 seconds';
  }
});
</script>
</body>
</html>
